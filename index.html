<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid & Flexbox Puzzle Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CSS Grid Page Layout Container -->
    <div class="page-grid">
        
        <!-- Section 1: Your Name and Selected Puzzle Name -->
        <header class="grid-section header-section">
            <h1>Joseph Davila</h1>
            <h2>Selected Puzzle: Butterflies</h2>
        </header>

        <!-- Section 2: Flexbox Puzzle Assembled -->
        <main class="grid-section puzzle-section">
            <div class="flex-puzzle-container">
                <img src="https://raw.githubusercontent.com/josephdavila179-spec/CSS-Grid-Layout/main/puzzle1_A.jpg" alt="Puzzle Piece A" class="puzzle-piece">
                <img src="image/puzzle1_B.jpg" alt="Puzzle Piece B" class="puzzle-piece">
                <img src="image/puzzle1_C.jpg" alt="Puzzle Piece C" class="puzzle-piece">
                <img src="image/puzzle1_D.jpg" alt="Puzzle Piece D" class="puzzle-piece">
                <img src="image/puzzle1_E.jpg" alt="Puzzle Piece E" class="puzzle-piece">
                <img src="image/puzzle1_F.jpg" alt="Puzzle Piece F" class="puzzle-piece">
                <img src="image/puzzle1_G.jpg" alt="Puzzle Piece G" class="puzzle-piece">
                <img src="image/puzzle1_H.jpg" alt="Puzzle Piece H" class="puzzle-piece">
                <img src="image/puzzle1_I.jpg" alt="Puzzle Piece I" class="puzzle-piece">
                <img src="image/puzzle1_J.jpg" alt="Puzzle Piece J" class="puzzle-piece">
                <img src="image/puzzle1_K.jpg" alt="Puzzle Piece K" class="puzzle-piece">
                <img src="image/puzzle1_L.jpg" alt="Puzzle Piece L" class="puzzle-piece">
                <img src="image/puzzle1_M.jpg" alt="Puzzle Piece M" class="puzzle-piece">
                <img src="image/puzzle1_N.jpg" alt="Puzzle Piece N" class="puzzle-piece">
                <img src="image/puzzle1_O.jpg" alt="Puzzle Piece O" class="puzzle-piece">
                <img src="image/puzzle1_P.jpg" alt="Puzzle Piece P" class="puzzle-piece">
                
                <!-- Faulty / Trick Puzzle Piece (Hidden via display property) -->
                <img src="image/puzzle1_Q.jpg" alt="Faulty Puzzle Piece Q" class="puzzle-piece trick-piece">
            </div>
        </main>

        <!-- Section 3: Assignment Completion Date -->
        <footer class="grid-section date-section">
            <p>Assignment Date: October 18, 2026</p>
        </footer>

    </div>
</body>
</html>
